name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: validate (linux, ${{ matrix.part }}/3)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: node --experimental-vm-modules --disable-warning=ExperimentalWarning scripts/check-import-cycles.ts
      - run: pnpm build
      - name: Run test part
        env:
          TEST_PART: ${{ matrix.part }}
        run: |
          if [[ "$TEST_PART" == 2 ]]; then
            node --test --test-shard=1/1 test/update.test.ts
          else
            files=()
            for file in test/*.test.ts; do
              if [[ "$file" != test/update.test.ts ]]; then
                files+=("$file")
              fi
            done
            shard=1
            if [[ "$TEST_PART" == 3 ]]; then
              shard=2
            fi
            node --test --test-shard="$shard/2" "${files[@]}"
          fi

  validate-macos:
    if: github.event_name == 'push'
    name: validate (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
