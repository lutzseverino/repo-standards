name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version already recorded in package.json
        required: true
        type: string
      verify_published:
        description: Only verify an already published release on macOS and Linux
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !inputs.verify_published }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify release version and unused tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const version = process.env.RELEASE_VERSION; assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/); assert.equal(JSON.parse(fs.readFileSync("package.json")).version, version);'
          if git rev-parse --verify "refs/tags/v$RELEASE_VERSION"; then
            echo 'Tag already exists; inspect the prior release before recovery.' >&2
            exit 1
          fi
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - if: runner.os == 'Linux'
        run: pnpm release:pack
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: release/
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: release
      - name: Verify bundle and publish its exact tarball
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          npm publish ./*.tgz --ignore-scripts --access public --registry=https://registry.npmjs.org
      - name: Publish matching bootstrap and bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "v$RELEASE_VERSION" release/* --target "$RELEASE_COMMIT" \
            --title "Repository Standards $RELEASE_VERSION" \
            --notes 'Public CLI package and standalone bootstrap. See the release procedure and acceptance evidence; publication does not close the parent release specification.'
      - name: Explain publication recovery
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const message = `Publication is incomplete or uncertain. From a checkout containing the recovery helper, run:\n\n` +
            `\`node scripts/release-status.ts ${process.env.GITHUB_RUN_ID} release-recovery-${process.env.GITHUB_RUN_ID}\`\n\n` +
            `This inspects the original validated bundle and prints the next action. See docs/release.md. Do not rerun publication before inspecting state.\n`;
          console.log(message);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, message);
          JS

  verify-publisher:
    if: ${{ inputs.verify_published }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify trusted publisher authentication without publishing
        run: node scripts/verify-npm-publisher.ts

  public-installation:
    needs: publish
    if: ${{ !cancelled() && (inputs.verify_published || needs.publish.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        # Use the Intel pool for anonymous public acquisition; shared arm64
        # egress repeatedly exhausted GitHub API quota during release acceptance.
        os: [ubuntu-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Record unauthenticated public GitHub API quota
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          let observation;
          try {
            const response = await fetch('https://api.github.com/rate_limit', { signal: AbortSignal.timeout(30000) });
            observation = { status: response.status, date: response.headers.get('date'),
              remaining: response.headers.get('x-ratelimit-remaining'), reset: response.headers.get('x-ratelimit-reset'),
              limits: await response.json() };
          } catch {
            observation = { status: null, error: 'Quota observation unavailable; public checks still run.' };
            process.exitCode = 1;
          }
          writeFileSync('public-api-quota.json', JSON.stringify(observation, null, 2) + '\n');
          console.log(JSON.stringify(observation));
          JS
      - env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node acceptance/public-installation.ts "$RELEASE_VERSION" public-installation.json
      - name: Acquire the standalone authoring skill and matching public CLI
        if: ${{ !cancelled() }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node acceptance/prepare-author.ts "$RELEASE_VERSION" public-author-installation.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-installation-${{ matrix.os }}
          path: |
            public-api-quota.json
            public-installation.json
            public-author-installation.json
          if-no-files-found: error
