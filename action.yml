name: Repository Standards update
description: Keep an adopting repository current through one rolling update pull request or issue.
author: lutzseverino
branding:
  icon: refresh-cw
  color: blue

inputs:
  token:
    description: >-
      The token for the CLI's GitHub requests, the push of the rolling branch,
      and the rolling pull request and issue. A GitHub App installation token
      is recommended; GITHUB_TOKEN is the fallback.
    required: false
    default: ${{ github.token }}
  agent-command:
    description: >-
      A shell command run in the checkout when the headless update stops, with
      the headless report's path in REPO_STANDARDS_REPORT. When it leaves the
      update ready to commit, the action opens the pull request instead of the
      issue.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    - shell: bash
      env:
        REPO_STANDARDS_TOKEN: ${{ inputs.token }}
        REPO_STANDARDS_AGENT_COMMAND: ${{ inputs.agent-command }}
      run: node "$GITHUB_ACTION_PATH/action/main.ts"
