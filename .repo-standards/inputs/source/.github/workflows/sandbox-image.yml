name: Sandbox image build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Sandbox image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build sandbox image when changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/sandbox-image-paths"
          changed=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .sandcastle/*|.github/workflows/sandbox-image.yml)
                changed=true
                break
                ;;
            esac
          done < "$RUNNER_TEMP/sandbox-image-paths"

          if [ "$changed" = true ]; then
            docker build \
              --build-arg "AGENT_UID=$(id -u)" \
              --build-arg "AGENT_GID=$(id -g)" \
              - < .sandcastle/Dockerfile
          else
            echo "No sandbox image changes; skipping build."
          fi
