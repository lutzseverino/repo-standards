name: Issue contracts

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

permissions: {}

concurrency:
  group: issue-contract-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate issue contract
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Validate authoritative issue state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/validate-issue-contract.mjs
